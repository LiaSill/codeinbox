<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/favicon.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Days+One&display=swap" rel="stylesheet">
  <title>Код В Квадрате</title>
</head>

<body>
  <div class="preloader" id="preloader">
    <img class="preloader__gif" src="assets/cat_loader.gif" alt="Загрузка">
  </div>
  <header class="header">
    <div class="container">
      <div class="header__wrapper">
        <a class="header__main-link" href="index.html" aria-label="Ссылка на главную страницу">
          <img class="header__icon-paw-main" src="images/paw-main.png" width="68" height="60" alt="">
          <img class="header__icon-paw-main header__icon-paw-main--active" src="images/paw-main-active.png" width="68" height="60" alt="">
        </a>
      </div>
    </div>
  </header>
  <main>
    <section class="main-page">
      <div class="container">
        <h1 class="visually-hidden">Код в Квадрате - Математические игры для детей</h1>
        <div class="main-page__wrapper">
          <img class="main-page__pawprint-img" src="images/pawprint.png" width="273" height="412" alt="Лапки">
          <a class="main-page__game-link" href="fish-count-game.html" aria-label="Ссылка на игру">
          </a>
          <ul class="codebox__list">
            <li class="codebox__item">
              <div class="codebox__box codebox__box--secret">
                <img class="codebox__icon-question-mark" src="images/question-mark.png" width="40" height="65" alt="Вопросительный знак">
              </div>
            </li>
            <li class="codebox__item">
              <div class="codebox__box">
                <img class="codebox__icon-lock" src="images/lock.png" width="66" height="78" alt="Замок">
              </div>
            </li>
            <li class="codebox__item">
              <div class="codebox__box">
                <img class="codebox__icon-lock" src="images/lock.png" width="66" height="78" alt="Замок">
              </div>
            </li>
            <li class="codebox__item">
              <div class="codebox__box">
                <img class="codebox__icon-lock" src="images/lock.png" width="66" height="78" alt="Замок">
              </div>
            </li>
          </ul>
          <img class="main-page__sun-img" src="images/sun.png" width="275" height="275" alt="Солнце">
        </div>
      </div>
    </section>
  </main>
  <div class="dialog-overlay" id="indexDialog">
    <div class="dialog-box">
      <img class="dialog-box__cat-img" id="indexCat-sprite" src="images/cat-dialog-1.png" width="180" height="230"
        alt="Кот Рудис">
      <div class="dialog-box__picture">
        <picture>
          <source media="(max-width: 767px)" srcset="images/dialog-bg-mobile.png">
          <img class="dialog-box__image" src="images/dialog-bg.png" width="1691" height="413" alt="Фон диалога">
        </picture>
      </div>
      <div class="dialog-box__content">
        <p class="dialog-box__text" id="indexDialog-text"></p>
        <div class="custom-input" id="name-container" hidden>
          <input class="custom-input__field" id="name" type="text" name="user-name" placeholder="Введи своё имя..."  maxlength="20">
        </div>
      </div>
      <button class="dialog-box__btn btn" id="indexNext-btn">
        <img class="dialog-box__paw-btn" src="images/paw-btn.png" width="231" height="220" alt="Кнопка-лапка">
        <img class="dialog-box__paw-btn dialog-box__paw-btn--active" src="images/paw-btn-active.png" width="231" height="220" alt="Кнопка-лапка активная">
      </button>
      <p class="dialog-box__tip" id="dialogTip">Нажми на лапку!</p>
    </div>
  </div>
  <footer class="footer">
    <div class="container">
       <img class="footer__cat-smiling-img" src="images/sitting-kitten.png" width="187" height="187" alt="Котёнок">
    </div>
  </footer>
  <script src="js/main.js"></script>
</body>

</html>
